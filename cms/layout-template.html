  <!-- ===== CSS BERSIH ===== -->
  <style>
    :root{
      --accent:#f8c300;
      --accent-dark:#e29f09;
      --ink:#1a1a1a;
      --muted:#5b5b5b;
      --line:#eaeaea;
      --bg:#ffffff;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Jost',sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;height:auto;display:block}
    .container{width:100%;max-width:1140px;margin:0 auto;padding:0 20px}

    /* Header */
    .site-header{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:100}
    .site-header .container{display:flex;align-items:center;justify-content:space-between;min-height:72px;gap:24px}
    .site-logo img{height:40px;width:auto}
    .site-nav{display:flex;gap:28px}
    .site-nav a{font-weight:500;color:var(--ink);padding:6px 0;border-bottom:2px solid transparent;transition:border-color .15s,color .15s}
    .site-nav a:hover{color:var(--accent-dark);border-bottom-color:var(--accent)}
    .nav-toggle{display:none;background:none;border:0;font-size:26px;cursor:pointer;color:var(--ink)}

    /* Content slot */
    .site-main{min-height:50vh}
    .site-main .container{padding-top:32px;padding-bottom:48px}

    /* Footer */
    .site-footer{background:var(--ink);color:#e6e6e6;margin-top:48px}
    .site-footer .container{padding-top:36px;padding-bottom:36px;display:flex;flex-wrap:wrap;gap:16px 40px;align-items:center;justify-content:space-between}
    .site-footer a{color:var(--accent)}
    .site-footer .contact{display:flex;flex-wrap:wrap;gap:8px 24px;font-size:15px}
    .site-footer .copyright{font-size:14px;color:#9a9a9a;width:100%;border-top:1px solid #333;padding-top:16px;margin-top:8px}

    @media (max-width:768px){
      .nav-toggle{display:block}
      .site-nav{display:none;position:absolute;top:72px;left:0;right:0;background:var(--bg);flex-direction:column;gap:0;border-bottom:1px solid var(--line);padding:8px 20px}
      .site-nav.open{display:flex}
      .site-nav a{padding:12px 0;border-bottom:1px solid var(--line)}
    }
  </style>
